name: bangun-image
# Membangun image mesin GPU dan menyimpannya di ghcr.io/<pemilik>/ezboard-gpu:<image dari alat-versi.txt> dan :latest
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - name: Kosongkan disk (image dasar RunPod besar)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Masuk ke ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Bangun dan kirim
        run: |
          V=$(grep '^image=' alat-versi.txt | cut -d= -f2)
          N=ghcr.io/$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')/ezboard-gpu
          docker build -t "$N:$V" -t "$N:latest" .
          docker push "$N:$V"
          docker push "$N:latest"
          docker images "$N"
